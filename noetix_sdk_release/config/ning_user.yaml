user:
  # Match the joint_names metadata in the N2 policy exported by play.py.
  policy_joint_order:
    - arm_l1_joint
    - leg_l1_joint
    - arm_r1_joint
    - leg_r1_joint
    - arm_l2_joint
    - leg_l2_joint
    - arm_r2_joint
    - leg_r2_joint
    - arm_l3_joint
    - leg_l3_joint
    - arm_r3_joint
    - leg_r3_joint
    - arm_l4_joint
    - leg_l4_joint
    - arm_r4_joint
    - leg_r4_joint
    - leg_l5_joint
    - leg_r5_joint
  init_state:
    # target angles [rad] when action = 0.0
    default_joint_angle:

      leg_l1_joint: 0.0
      leg_l2_joint: 0.0
      leg_l3_joint: -0.1495
      leg_l4_joint: 0.3215
      leg_l5_joint: -0.1720
      leg_r1_joint: 0.0
      leg_r2_joint: 0.0
      leg_r3_joint: -0.1495
      leg_r4_joint: 0.3215
      leg_r5_joint: -0.1720

      arm_l1_joint: 0.0
      arm_l2_joint: 0.2
      arm_l3_joint: 0.0
      arm_l4_joint: 0.0
      arm_r1_joint: 0.0
      arm_r2_joint: -0.2
      arm_r3_joint: 0.0
      arm_r4_joint: 0.0


  control:
    stiffness:
      leg_l1_joint: 80
      leg_l2_joint: 80
      leg_l3_joint: 120
      leg_l4_joint: 120
      leg_l5_joint: 20
      leg_r1_joint: 80
      leg_r2_joint: 80
      leg_r3_joint: 120
      leg_r4_joint: 120
      leg_r5_joint: 20

      arm_l1_joint: 30
      arm_l2_joint: 30
      arm_l3_joint: 30
      arm_l4_joint: 30
      arm_r1_joint: 30
      arm_r2_joint: 30
      arm_r3_joint: 30
      arm_r4_joint: 30

    damping:
      leg_l1_joint: 5
      leg_l2_joint: 5
      leg_l3_joint: 5
      leg_l4_joint: 5
      leg_l5_joint: 2
      leg_r1_joint: 5
      leg_r2_joint: 5
      leg_r3_joint: 5
      leg_r4_joint: 5
      leg_r5_joint: 2
      
      arm_l1_joint: 1
      arm_l2_joint: 1
      arm_l3_joint: 1
      arm_l4_joint: 1
      arm_r1_joint: 1
      arm_r2_joint: 1
      arm_r3_joint: 1
      arm_r4_joint: 1

    action_scale:
      arm_l1_joint: 0.225
      arm_l2_joint: 0.225
      arm_l3_joint: 0.225
      arm_l4_joint: 0.225
      arm_r1_joint: 0.225
      arm_r2_joint: 0.225
      arm_r3_joint: 0.225
      arm_r4_joint: 0.225
      leg_l1_joint: 0.28125
      leg_l2_joint: 0.28125
      leg_l3_joint: 0.3125
      leg_l4_joint: 0.3125
      leg_l5_joint: 0.875
      leg_r1_joint: 0.28125
      leg_r2_joint: 0.28125
      leg_r3_joint: 0.3125
      leg_r4_joint: 0.3125
      leg_r5_joint: 0.875
    decimation: 10
    cycle_time: 0.64

  normalization:
    clip_scales:
      clip_observations: 18.0
      clip_actions: 18.0
    obs_scales:
      lin_vel: 1
      ang_vel: 1
      dof_pos: 1
      dof_vel: 1
      quat: 1
      height_measurements: 5.0

  size:
    actions_size: 18
    observations_size: 62
    observations_size_bydmimic: 99
    stack_size: 5

  axis_mappings:
    scalez: 0.8
    scalex: 1.0
    scaley: 0.0   
